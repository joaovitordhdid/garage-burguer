<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Entregas · Garage Burger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/entregador.css">
  <script src="/js/entregador.js" defer></script>
</head>
<body class="en">
  <header class="en-top">
    <div class="en-brand">GARAGE<span>BURGER</span></div>
    <div class="en-top__sub" id="driver">Entregas</div>
  </header>

  <main class="en-main" id="main" aria-live="polite">
    <div class="en-msg" id="loading"><p>Carregando a rota…</p></div>
    <div class="en-msg" id="error" hidden>
      <h1 id="error-title">Rota não encontrada</h1>
      <p id="error-text">Peça um link novo para a loja.</p>
    </div>

    <section id="route" hidden>
      <div class="en-summary">
        <div>
          <strong id="progress-text">0 de 0 entregues</strong>
          <div class="en-progress"><i id="progress-bar"></i></div>
        </div>
        <a class="gb-btn en-summary__maps" id="maps-all" href="#" target="_blank" rel="noopener">Rota no Maps</a>
      </div>
      <div class="en-done" id="done" hidden>
        <div class="en-done__icon" aria-hidden="true">✓</div>
        <h2>Rota concluída!</h2>
        <p>Todas as entregas foram marcadas. Pode voltar para a loja.</p>
      </div>
      <ol class="en-stops" id="stops"></ol>
      <p class="en-foot">Atualiza sozinho a cada 30 s · <button type="button" class="en-link" id="refresh">Atualizar agora</button></p>
    </section>
  </main>

  <div class="en-toast" id="toast" role="status" hidden></div>
</body>
</html>
